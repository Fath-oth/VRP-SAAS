name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'shared-lib/**'       
      - 'pom.xml'            
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'shared-lib/**'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Job 1: Build & Unit-Test all Maven modules ─────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vrp
          POSTGRES_PASSWORD: vrp
          POSTGRES_DB: vrpdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        #run: mvn -B verify --no-transfer-progress
        run: mvn clean install -DskipTests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vrpdb
          SPRING_DATASOURCE_USERNAME: vrp
          SPRING_DATASOURCE_PASSWORD: vrp
          SPRING_REDIS_HOST: localhost

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"

  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [orders-service, fleet-service, tracking-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load (dry-run)
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: false
          load: true # Loads image into local docker for scanning
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:ci

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:ci
          format: 'table'
          exit-code: '1' # Fails the build on high-risk vulnerabilities
          severity: 'CRITICAL,HIGH'

  # ── Job 3: CodeQL SAST ──────────────────────────────────────
  codeql:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    needs: build # Ensures code at least compiles before deep analysis
    permissions:
      security-events: write # Required to post results to the Security tab
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java, python # Scans both your Spring Boot and Python logic

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # CodeQL requires a build to "observe" the Java code structure
      - name: Build for Analysis
        run: mvn clean compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
