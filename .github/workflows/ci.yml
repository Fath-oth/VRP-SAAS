name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Job 1: Build & Unit-Test all Maven modules ─────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vrp
          POSTGRES_PASSWORD: vrp
          POSTGRES_DB: vrpdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        #run: mvn -B verify --no-transfer-progress
        run: mvn clean install -DskipTests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vrpdb
          SPRING_DATASOURCE_USERNAME: vrp
          SPRING_DATASOURCE_PASSWORD: vrp
          SPRING_REDIS_HOST: localhost

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"

  # ── Job 2: Build Docker images ──────────────────────────────
  # docker-build:
  #   name: Docker Build (dry-run)
  #   runs-on: ubuntu-latest
  #   needs: build
  #   strategy:
  #     matrix:
  #       service:
  #         - services/orders-service
  #         - services/fleet-service
  #         - services/tracking-service
  #         - services/api-gateway
  #         - optimization-engine

  #   steps:
  #     - uses: actions/checkout@v4

  #     - name: Set up Docker Buildx
  #       uses: docker/setup-buildx-action@v3

  #     - name: Build image (no push on PR)
  #       uses: docker/build-push-action@v6
  #       with:
  #         context: ${{ matrix.service }}
  #         push: false           # push only in release.yml
  #         tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:ci
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max

  # ── Job 3: CodeQL SAST ──────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java, python

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build for CodeQL
        run: mvn -B compile -DskipTests --no-transfer-progress

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
